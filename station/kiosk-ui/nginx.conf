server {
    listen 80;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;
    location /api/eye/eye/stream {
        set $upstream http://gateway:8080;
        proxy_pass $upstream/api/eye/eye/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        add_header Cache-Control no-cache;
    }
    location /api/ {
        set $upstream http://gateway:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin {
        set $upstream http://gateway:8080;
        proxy_pass $upstream/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /ws {
        set $upstream http://gateway:8080;
        proxy_pass $upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
    location /iphone-cam/ {
        proxy_pass http://192.168.0.106:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.0.106;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
